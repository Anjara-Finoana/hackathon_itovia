name: CI/CD Production Deploy

on:
  push:
    branches:
      - finoana
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Test & Build (Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Build & Typecheck Frontend
        run: |
          npm ci
          npm run build

      - name: Build & Typecheck Backend
        run: |
          cd server
          npm ci
          npx prisma generate
          npm run build

  deploy:
    name: Deploy to Production VPS
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement via SSH natif
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -e

          # 1. Vérification de la présence des variables requises
          if [ -z "$PROD_SSH_KEY" ]; then
            echo "::error::Le secret PROD_SSH_KEY est vide ou inaccessible ! Vérifiez qu'il est bien présent dans 'Repository secrets'."
            exit 1
          fi
          if [ -z "$PROD_HOST" ]; then
            echo "::error::Le secret PROD_HOST est vide ou inaccessible !"
            exit 1
          fi

          # 2. Configuration et nettoyage du client SSH natif (suppression des \r Windows)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$PROD_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Diagnostic : validation que la clé est correctement chargée par OpenSSH
          echo "🔑 Empreinte de la clé SSH détectée :"
          ssh-keygen -l -f ~/.ssh/deploy_key

          # 3. Connexion et exécution distante via OpenSSH
          PORT="${PROD_PORT:-22}"
          USER="${PROD_USER:-whart}"

          echo "🔐 Connexion SSH vers $USER@$PROD_HOST:$PORT..."
          ssh -i ~/.ssh/deploy_key \
              -p "$PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR \
              "$USER@$PROD_HOST" << 'EOF'
            set -e
            echo "🚀 Début du déploiement OffRec sur la branche finoana..."
            cd /home/whart/Projects/Finoana/hackathon_itovia

            echo "📥 Synchronisation du code Git..."
            git fetch origin finoana
            git reset --hard origin/finoana

            echo "🐳 Reconstruction des conteneurs de production..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Nettoyage des images Docker inutilisées..."
            docker image prune -f

            echo "🩺 Vérification de l'API..."
            sleep 5
            curl -fsS http://127.0.0.1:3080/api/health || { echo "❌ Échec du contrôle de santé"; exit 1; }

            echo "✅ Déploiement en production terminé avec succès !"
          EOF
