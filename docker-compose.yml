services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finoanaNorohanta}
      POSTGRES_DB: ${POSTGRES_DB:-offrec}
    volumes:
      - offrec_db_data:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-offrec}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-finoanaNorohanta}@db:5432/${POSTGRES_DB:-offrec}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-finoanaNorohanta}@db:5432/${POSTGRES_DB:-offrec}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_NAME: ${COOKIE_NAME:-offrec_session}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://offrec.ffn-tech.com}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-OffRec <onboarding@resend.dev>}
      RESEND_NOTIFICATION_FROM_EMAIL: ${RESEND_NOTIFICATION_FROM_EMAIL:-OffRec <onboarding@resend.dev>}
      EMAIL_SENDING_DISABLED: ${EMAIL_SENDING_DISABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      HIRING_JOBS_ENABLED: ${HIRING_JOBS_ENABLED:-true}
      ALLOW_DEMO_VERIFICATION: ${ALLOW_DEMO_VERIFICATION:-false}
      BOT_PROVIDER: ${BOT_PROVIDER:-custom_headless}
      BOT_SERVICE_URL: ${BOT_SERVICE_URL:-http://bot-service:5001}
      INTERNAL_BOT_SECRET: ${INTERNAL_BOT_SECRET:-finoana_bot_secret_local}
    volumes:
      - offrec_uploads_cv:/app/server/uploads/cv
      - offrec_uploads_preuves:/app/server/uploads/preuves
    networks:
      - internal-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    container_name: offrec-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:80"
    depends_on:
      - api
    networks:
      - internal-net

  bot-service:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: offrec-bot-service
    restart: unless-stopped
    init: true
    shm_size: '512mb'
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1280M
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - api
    environment:
      PORT: 5001
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      INTERNAL_BOT_SECRET: ${INTERNAL_BOT_SECRET:-finoana_bot_secret_local}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      MAX_ACTIVE_BOTS: 1
      BOT_TIMEOUT_MINUTES: 75
    networks:
      - internal-net

volumes:
  offrec_db_data:
  offrec_uploads_cv:
  offrec_uploads_preuves:

networks:
  internal-net:
    driver: bridge
